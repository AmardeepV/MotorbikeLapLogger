[platformio]
default_envs = nicla_live_ble

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nicla_sense_me]
platform = nordicnrf52@11.0.0
board = nicla_sense_me
framework = arduino
monitor_speed = 115200

lib_deps =
    arduino-libraries/Arduino_BHY2@1.0.8
    arduino-libraries/ArduinoBLE@2.1.0

[env:nicla_live_ble]
extends = env:nicla_sense_me
build_flags = -DNICLA_LIVE_BLE
build_src_filter = +<*> -<SensorDiagnostics.cpp>
